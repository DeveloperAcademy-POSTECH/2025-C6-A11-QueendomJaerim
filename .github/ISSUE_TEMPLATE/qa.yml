name: "🧪 확인용 빌드"
title: "🧪 [QA] 태스크 요약"
description: develop 상태를 TestFlight에 올려 디자이너·PM에게 확인 요청
labels:
  - qa
body:
  - type: markdown
    attributes:
      value: |-
        이 이슈에 `/qa` 라고 댓글을 달면 develop 상태가 TestFlight에 올라갑니다.
        확인 → 수정 → 다시 `/qa` 를 필요한 만큼 반복하고, 확인이 끝나면 이슈를 닫아 주세요.

        확인용 빌드는 버전을 올리지 않습니다. 빌드 번호가 출시본보다 크면 확인용입니다.
  - type: textarea
    id: textarea-0
    attributes:
      label: 개요
      description: 이번 빌드에서 무엇을 확인받고 싶은지 작성합니다.
    validations:
      required: true
  - type: textarea
    id: textarea-1
    attributes:
      label: 확인할 내용
      description: 확인해 주셨으면 하는 화면과 동작을 작성합니다.
      value: |-
        - [ ] 확인 1
        - [ ] 확인 2
    validations:
      required: true
  - type: textarea
    id: textarea-2
    attributes:
      label: 관련 이슈·PR
      description: 이번 확인과 관련된 이슈와 PR을 적습니다. `/qa`를 다시 돌릴 때마다 덧붙입니다.
      value: |-
        - #000 기능 이슈
        - #000 PR
    validations:
      required: true
  - type: input
    id: input-3
    attributes:
      label: 확인기한
      description: 확인 기한을 지정합니다.
      placeholder: "2025-10-01 수"
  - type: textarea
    id: textarea-4
    attributes:
      label: 노션링크
      value: 없음
  - type: textarea
    id: textarea-5
    attributes:
      label: 비고
      value: 없음
  - type: textarea
    id: textarea-6
    attributes:
      label: 참조자
      value: cc. @Jeongin-c (PM)
