name: QA

run-name: >-
  QA · ${{ github.event_name == 'workflow_dispatch'
    && format('{0} · {1}', inputs.mode, github.ref_name)
    || format('업로드 · develop · #{0}', github.event.issue.number) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "검증만 = Archive와 번들 검사까지 (애플에 전송하지 않고 빌드 번호도 올리지 않음). 업로드 = TestFlight 전송까지"
        type: choice
        default: 검증만
        options:
          - 검증만
          - 업로드
  issue_comment:
    types: [created]

# 두 명이 동시에 실행하면 같은 빌드 번호를 읽어 뒤쪽 push가 거부된다.
# 애플 업로드 도중에 죽이는 쪽이 대기보다 나쁘므로 취소하지 않고 줄을 세운다.
concurrency:
  group: qa-testflight
  cancel-in-progress: false

jobs:
  archive-and-upload:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        startsWith(github.event.issue.title, '🧪 [QA]') &&
        github.event.comment.body == '/qa' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: macos-15
    permissions:
      # develop push는 GITHUB_TOKEN이 아니라 DeployKey로 한다.
      contents: read
      issues: write
    env:
      # 댓글 단계는 Checkout 이전에 실행되어 gh가 저장소를 추론하지 못한다.
      GH_REPO: ${{ github.repository }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      BUILD_PROVISION_PROFILE_ADHOC_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_ADHOC_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

    steps:
      - name: Post QA Start Comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "🚀 **확인용 빌드 Archive 및 업로드가 시작되었습니다.**

          - **Archive 대상:** develop
          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 댓글 실행은 언제나 develop을, 수동 실행은 시험하려는 브랜치를 가져온다.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'develop' }}
          # protect develop의 bypass 대상이 이 DeployKey 하나뿐이다.
          # 이걸로 checkout해야 빌드 번호 커밋이 PR 없이 들어간다.
          ssh-key: ${{ secrets.DEPLOY_KEY_SECRET }}
          fetch-depth: 0

      # 빌드 번호를 먼저 올려 push한다. Archive가 뒤에 실패하면 번호에 구멍이 나지만
      # 애플은 증가만 요구하므로 무해하다. 반대로 업로드 뒤에 push하면 업로드된 번호가
      # develop에 남지 않아, 다음 실행이 같은 번호를 다시 올리고 애플이 중복으로 거부한다.
      # DeployKey와 bypass 설정이 틀렸을 때 20분짜리 Archive 전에 빨리 실패하는 이점도 있다.
      - name: Bump build number
        # 수동 실행은 develop이 아닌 브랜치를 고를 수 있으므로 push하지 않는다.
        if: github.event_name == 'issue_comment'
        run: |
          XCODE_PROJ_PATH="QueenCam/QueenCam.xcodeproj/project.pbxproj"

          OLD_BUILD_NUMBER=$(grep -m 1 "CURRENT_PROJECT_VERSION =" "$XCODE_PROJ_PATH" | sed -E 's/.*=[[:space:]]*([0-9]+);/\1/')

          # 읽기에 실패하면 빈 값이 되고, $(( + 1))은 오류가 아니라 1을 만든다.
          # 그대로 두면 빌드 번호가 1로 떨어진 채 커밋되고 Archive를 다 마친 뒤
          # 애플이 거부한다. 20분을 쓰기 전에 여기서 멈춘다.
          if ! echo "$OLD_BUILD_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::project.pbxproj에서 CURRENT_PROJECT_VERSION을 읽지 못했습니다. (읽은 값: '$OLD_BUILD_NUMBER')"
            exit 1
          fi

          NEW_BUILD_NUMBER=$((OLD_BUILD_NUMBER + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $NEW_BUILD_NUMBER;/g" "$XCODE_PROJ_PATH"

          # sed가 빗나가면 커밋할 것이 없어 다음 단계가 애매하게 실패한다.
          if git diff --quiet -- "$XCODE_PROJ_PATH"; then
            echo "::error::빌드 번호를 $NEW_BUILD_NUMBER로 바꾸지 못했습니다. project.pbxproj 형식을 확인해 주세요."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$XCODE_PROJ_PATH"
          git commit -m "[Chore] cd: 확인용 빌드 번호 $NEW_BUILD_NUMBER로 증가 (#${{ github.event.issue.number }})"
          git push origin HEAD:develop

          echo "BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$GITHUB_ENV"
          # 이 커밋이 실제로 Archive되는 develop 상태다. 어느 빌드가 어느 상태였는지
          # 되짚을 수 있게 완료 댓글에 남긴다.
          echo "BUILD_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # 저장소에 없는 파일이라, 빠지면 FirebaseApp.configure()에서 실행 즉시 죽는다.
      # 동기화 그룹이라 제자리에 쓰기만 하면 번들에 자동 포함된다.
      - name: Restore Firebase config
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 시크릿이 비어 있습니다. 그대로 빌드하면 실행 즉시 크래시하는 앱이 올라갑니다."
            exit 1
          fi

          PLIST_PATH="QueenCam/QueenCam/GoogleService-Info.plist"
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > "$PLIST_PATH"
          plutil -lint "$PLIST_PATH"

      # 러너 기본 Xcode는 프로젝트 배포 타겟(iOS 26)을 지원하지 않을 수 있다.
      - name: Select Xcode
        run: |
          echo "사용 가능한 Xcode:"
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "선택: $LATEST"
          sudo xcode-select -s "$LATEST"
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install signing assets
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          APPSTORE_PROFILE_PATH="$RUNNER_TEMP/QueenCamAppStore.mobileprovision"
          ADHOC_PROFILE_PATH="$RUNNER_TEMP/QueenCamDis.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$APPSTORE_PROFILE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_ADHOC_BASE64" | base64 -D > "$ADHOC_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Xcode 16부터 프로비저닝 프로파일 경로가 바뀌었다.
          # 로컬과 같은 흐름을 재현하려면 둘 다 필요하다. 아카이브는 프로젝트 설정대로
          # QueenCamDis로 서명하고, export에서 QueenCamAppStore로 재서명한다.
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$APPSTORE_PROFILE_PATH" "$ADHOC_PROFILE_PATH" "$PROFILE_DIR"

      - name: Archive and upload to TestFlight
        env:
          # SwiftLint 플러그인은 Xcode 신뢰 승인이 필요한데 CI에는 그 상태가 없다.
          # 서명 설정은 여기 넣지 않는다. xcargs는 SPM 타겟에도 전역 적용되어 실패하고,
          # 서명을 끄면 권한 처리 단계가 통째로 빠져 Wi-Fi Aware 권한이 앱에서 사라진다.
          GYM_XCARGS: -skipPackagePluginValidation
          GYM_EXPORT_TEAM_ID: D22ZM93S77
          # SPM 패키지가 16개라 xcodebuild -showBuildSettings가 기본 3초 안에 끝나지 않는다.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
        run: |
          if [ "${{ inputs.mode }}" = "검증만" ]; then
            bundle exec fastlane ios verify
          else
            bundle exec fastlane ios testflight
          fi

      - name: Post QA Success Comment
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ **확인용 빌드를 TestFlight에 올렸습니다. (빌드 $BUILD_NUMBER)**

          App Store Connect 처리가 끝나면 내부 테스터에게 자동으로 전달됩니다.

          - **Archive한 develop 커밋:** \`$BUILD_COMMIT\`
          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Post QA Failure Comment
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ **확인용 빌드 Archive 또는 업로드 중 오류가 발생했습니다.**

          Actions 로그를 확인해 주세요.

          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP"/*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/QueenCam*.mobileprovision
          rm -f QueenCam/QueenCam/GoogleService-Info.plist
