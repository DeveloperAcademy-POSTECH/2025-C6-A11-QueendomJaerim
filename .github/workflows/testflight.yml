name: TestFlight

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  archive-and-upload:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        startsWith(github.event.issue.title, '🎤 [Release]') &&
        github.event.comment.body == '/testflight' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: macos-15
    permissions:
      contents: read
      issues: write
    env:
      # 댓글 단계는 Checkout 이전에도 실행되므로, gh가 저장소를 git remote로 추론하지 못한다.
      # 저장소를 환경 변수로 고정해 Checkout 성공 여부와 무관하게 댓글이 남도록 한다.
      GH_REPO: ${{ github.repository }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Post TestFlight Start Comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "🚀 **TestFlight Archive 및 업로드가 시작되었습니다.**

          - **Archive 대상:** main
          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install signing assets
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROVISIONING_PROFILE_PATH="$RUNNER_TEMP/QueenCamAppStore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$PROVISIONING_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Xcode 16부터 프로비저닝 프로파일 경로가 바뀌었다. 어느 쪽을 읽든 찾도록 두 곳 모두에 설치한다.
          LEGACY_PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          CURRENT_PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$LEGACY_PROFILE_DIR" "$CURRENT_PROFILE_DIR"
          cp "$PROVISIONING_PROFILE_PATH" "$LEGACY_PROFILE_DIR"
          cp "$PROVISIONING_PROFILE_PATH" "$CURRENT_PROFILE_DIR"

      - name: Archive and upload to TestFlight
        env:
          # Xcode 프로젝트의 Release 구성은 로컬 수동 배포용 QueenCamDis를 가리킨다.
          # QueenCamDis는 등록 기기가 포함된 Ad Hoc 프로파일이고 CI에는 설치되지 않으므로,
          # Archive 시점 서명 설정을 App Store용 QueenCamAppStore로 덮어쓴다.
          # Fastfile은 환경 중립으로 두고, CI 전용 값만 여기서 주입한다.
          GYM_XCARGS: >-
            CODE_SIGN_STYLE=Manual
            DEVELOPMENT_TEAM=D22ZM93S77
            PROVISIONING_PROFILE_SPECIFIER=QueenCamAppStore
            CODE_SIGN_IDENTITY="Apple Distribution"
          GYM_EXPORT_TEAM_ID: D22ZM93S77
        run: bundle exec fastlane ios testflight

      - name: Post TestFlight Success Comment
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ **TestFlight Archive 및 업로드가 성공적으로 완료되었습니다.**

          App Store Connect에서 새 빌드의 처리 상태를 확인해 주세요.

          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Post TestFlight Failure Comment
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ **TestFlight Archive 또는 업로드 중 오류가 발생했습니다.**

          Actions 로그를 확인한 뒤, 필요하면 기존 Xcode 수동 업로드를 사용해 주세요.

          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/QueenCamAppStore.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/QueenCamAppStore.mobileprovision"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/QueenCamAppStore.mobileprovision"
