name: TestFlight

# 실행 목록에서 이 실행이 시험이었는지 실제 업로드였는지 한 줄로 보이게 한다.
run-name: >-
  TestFlight · ${{ github.event_name == 'workflow_dispatch'
    && format('{0} · {1}', inputs.mode, github.ref_name)
    || '업로드 · main' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "검증만 = Archive와 번들 검사까지 (애플에 전송하지 않음). 업로드 = TestFlight 전송까지"
        type: choice
        default: 검증만
        options:
          - 검증만
          - 업로드
  issue_comment:
    types: [created]

jobs:
  archive-and-upload:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        startsWith(github.event.issue.title, '🎤 [Release]') &&
        github.event.comment.body == '/testflight' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: macos-15
    permissions:
      contents: read
      issues: write
    env:
      # 댓글 단계는 Checkout 이전에도 실행되므로, gh가 저장소를 git remote로 추론하지 못한다.
      # 저장소를 환경 변수로 고정해 Checkout 성공 여부와 무관하게 댓글이 남도록 한다.
      GH_REPO: ${{ github.repository }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

    steps:
      - name: Post TestFlight Start Comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "🚀 **TestFlight Archive 및 업로드가 시작되었습니다.**

          - **Archive 대상:** main
          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 댓글 실행은 배포 대상인 main을, 수동 실행은 시험하려는 브랜치를 가져온다.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

      # GoogleService-Info.plist는 .gitignore 대상이라 러너의 체크아웃에는 없다.
      # 없는 채로 Archive하면 FirebaseApp.configure()가 실패해 실행 즉시 죽는 앱이 만들어진다.
      # 프로젝트가 동기화 그룹을 쓰므로 제자리에 쓰기만 하면 번들에 자동 포함된다.
      - name: Restore Firebase config
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 시크릿이 비어 있습니다. 그대로 빌드하면 실행 즉시 크래시하는 앱이 올라갑니다."
            exit 1
          fi

          PLIST_PATH="QueenCam/QueenCam/GoogleService-Info.plist"
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > "$PLIST_PATH"
          plutil -lint "$PLIST_PATH"

      # 러너 기본 Xcode는 프로젝트 배포 타겟(iOS 26)을 지원하지 않을 수 있다.
      - name: Select Xcode
        run: |
          echo "사용 가능한 Xcode:"
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "선택: $LATEST"
          sudo xcode-select -s "$LATEST"
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install signing assets
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROVISIONING_PROFILE_PATH="$RUNNER_TEMP/QueenCamAppStore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$PROVISIONING_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Xcode 16부터 프로비저닝 프로파일 경로가 바뀌었다.
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PROVISIONING_PROFILE_PATH" "$PROFILE_DIR"

      - name: Archive and upload to TestFlight
        env:
          # SwiftLint 빌드 툴 플러그인은 Xcode에서 사용자 신뢰 승인이 필요한데
          # CI에는 그 상태가 없어 Archive가 실패한다.
          GYM_XCARGS: -skipPackagePluginValidation
          # 프로젝트 Release 구성은 로컬 수동 배포용 QueenCamDis(Ad Hoc)를 가리키고
          # CI에는 QueenCamAppStore만 설치된다. 서명 설정을 xcargs로 넘기면 SPM 패키지
          # 타겟에까지 전역 적용되어 실패하므로, Archive는 서명 없이 수행하고
          # export 단계에서 Fastfile의 export_options로 서명한다.
          GYM_SKIP_CODESIGNING: "true"
          GYM_EXPORT_TEAM_ID: D22ZM93S77
          # SPM 패키지가 16개라 xcodebuild -showBuildSettings가 기본 3초 안에 끝나지 않는다.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
        run: |
          if [ "${{ inputs.mode }}" = "검증만" ]; then
            bundle exec fastlane ios verify
          else
            bundle exec fastlane ios testflight
          fi

      - name: Post TestFlight Success Comment
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ **TestFlight Archive 및 업로드가 성공적으로 완료되었습니다.**

          App Store Connect에서 새 빌드의 처리 상태를 확인해 주세요.

          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Post TestFlight Failure Comment
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ **TestFlight Archive 또는 업로드 중 오류가 발생했습니다.**

          Actions 로그를 확인한 뒤, 필요하면 기존 Xcode 수동 업로드를 사용해 주세요.

          - **Actions:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/QueenCamAppStore.mobileprovision"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/QueenCamAppStore.mobileprovision"
          rm -f QueenCam/QueenCam/GoogleService-Info.plist
